<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SensorBoard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>SensorBoard</h1>
    <div id="status" class="status status--wait">
      <span class="dot"></span>
      <span id="status-text">Connecting…</span>
    </div>
  </header>

  <main>
    <section class="controls">
      <label>
        Device
        <select id="device"></select>
      </label>
      <label>
        Show last
        <select id="limit">
          <option value="20">20</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="200">200</option>
        </select>
        readings
      </label>
    </section>

    <section class="cards">
      <article class="card card--main">
        <h2>Latest</h2>
        <p class="value" id="stat-latest">–</p>
      </article>
      <article class="card">
        <h2>Minimum</h2>
        <p class="value" id="stat-min">–</p>
      </article>
      <article class="card">
        <h2>Maximum</h2>
        <p class="value" id="stat-max">–</p>
      </article>
      <article class="card">
        <h2>Average</h2>
        <p class="value" id="stat-avg">–</p>
      </article>
    </section>

    <section class="panel">
      <h2>Readings over time</h2>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
      </div>
    </section>

    <section class="panel">
      <h2>Latest readings</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Time</th><th>Sensor</th><th>Value</th></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
